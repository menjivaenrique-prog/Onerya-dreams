<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONERYA DREAMS</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #090014;
      color: white;
    }

    main {
      width: 90%;
      max-width: 800px;
      margin: auto;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      font-size: 42px;
      letter-spacing: 3px;
    }

    .subtitle {
      color: #c9b8e8;
      font-size: 20px;
      margin-bottom: 35px;
    }

    button {
      background: #7c3aed;
      color: white;
      border: 0;
      padding: 15px 28px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      margin: 8px;
    }

    button:hover {
      background: #9333ea;
    }

    #dreamBox {
      display: none;
      margin-top: 30px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid #5b3b88;
      background: #160827;
      color: white;
      font-size: 17px;
    }

    #story {
      display: none;
      margin-top: 30px;
      padding: 25px;
      background: #160827;
      border-radius: 14px;
      text-align: left;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    #videoButton {
      display: none;
      margin-top: 25px;
      background: #9333ea;
    }

    #videoStatus {
      display: none;
      margin-top: 20px;
      color: #c9b8e8;
    }
  </style>
</head>

<body>

<main>

  <h1>ONERYA DREAMS</h1>

  <p class="subtitle">
    Transforme ton rêve en expérience cinématographique.
  </p>

  <button id="createButton">
    Créer mon rêve
  </button>

  <section id="dreamBox">

    <textarea
      id="dreamInput"
      placeholder="Décris ton rêve ici..."
    ></textarea>

    <br>

    <button id="generateButton">
      Générer mon histoire
    </button>

    <div id="story"></div>

    <button id="videoButton">
      🎥 Générer les vidéos
    </button>

    <p id="videoStatus"></p>

  </section>

</main>

<script>

const createButton = document.getElementById("createButton");
const dreamBox = document.getElementById("dreamBox");
const generateButton = document.getElementById("generateButton");
const dreamInput = document.getElementById("dreamInput");
const story = document.getElementById("story");
const videoButton = document.getElementById("videoButton");
const videoStatus = document.getElementById("videoStatus");

createButton.onclick = function() {

  dreamBox.style.display = "block";
  createButton.style.display = "none";

  dreamInput.focus();

};

generateButton.onclick = async function() {

  const dream = dreamInput.value.trim();

  if (!dream) {
    alert("Décris ton rêve avant de continuer.");
    return;
  }

  story.style.display = "block";
  videoButton.style.display = "none";

  story.textContent = "✨ ONERYA DREAMS crée tes scènes...";

  try {

    const response = await fetch("/api/generate-story", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        dream: dream
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Erreur");
    }

    story.textContent = data.story;

    videoButton.style.display = "inline-block";

  } catch (error) {

    story.textContent =
      "Impossible de générer les scènes pour le moment.";

    console.error(error);

  }

};

videoButton.onclick = function() {

  videoStatus.style.display = "block";

  videoStatus.textContent =
    "🎬 Préparation des 5 scènes vidéo...";

  setTimeout(function() {

    videoStatus.textContent =
      "✨ Les 5 scènes sont prêtes pour le moteur vidéo ONERYA DREAMS.";

  }, 2000);

};

</script>

</body>
</html>
