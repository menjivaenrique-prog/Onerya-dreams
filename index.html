<script>

const createButton = document.getElementById("createButton");
const dreamBox = document.getElementById("dreamBox");
const generateButton = document.getElementById("generateButton");
const dreamInput = document.getElementById("dreamInput");
const story = document.getElementById("story");
const videoButton = document.getElementById("videoButton");
const production = document.getElementById("production");
const finalMessage = document.getElementById("finalMessage");

createButton.onclick = function() {

  dreamBox.style.display = "block";
  createButton.style.display = "none";

  dreamInput.focus();

};

generateButton.onclick = async function() {

  const dream = dreamInput.value.trim();

  if (!dream) {
    alert("Décris ton rêve avant de continuer.");
    return;
  }

  story.style.display = "block";
  videoButton.style.display = "none";
  production.style.display = "none";
  finalMessage.style.display = "none";

  story.textContent = "✨ ONERYA DREAMS crée ton histoire...";

  try {

    const response = await fetch("/api/generate-story", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        dream: dream
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Erreur");
    }

    story.textContent = data.story;

    videoButton.style.display = "inline-block";

  } catch (error) {

    story.textContent =
      "Impossible de générer l'histoire.";

    console.error(error);

  }

};

videoButton.onclick = function() {

  production.style.display = "block";
  finalMessage.style.display = "none";

  const statuses = [
    document.getElementById("status1"),
    document.getElementById("status2"),
    document.getElementById("status3"),
    document.getElementById("status4"),
    document.getElementById("status5")
  ];

  let current = 0;

  statuses.forEach(status => {
    status.textContent = "⏳ En attente";
  });

  const interval = setInterval(function() {

    if (current > 0) {
      statuses[current - 1].textContent = "✅ Scène prête";
    }

    if (current < statuses.length) {
      statuses[current].textContent =
        "🎬 Génération de la scène...";
    }

    current++;

    if (current > statuses.length) {

      clearInterval(interval);

      finalMessage.style.display = "block";

    }

  }, 1200);

};

</script>
