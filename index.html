<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONERYA DREAMS</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #090014;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    main {
      width: 90%;
      max-width: 700px;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 42px;
      letter-spacing: 3px;
    }

    .subtitle {
      color: #c9b8e8;
      font-size: 20px;
      margin-bottom: 35px;
    }

    button {
      background: #7c3aed;
      color: white;
      border: 0;
      padding: 15px 28px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    #dreamBox {
      display: none;
      margin-top: 30px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid #5b3b88;
      background: #160827;
      color: white;
      font-size: 17px;
    }

    #generateButton {
      margin-top: 18px;
    }

    #story {
      display: none;
      margin-top: 30px;
      padding: 20px;
      background: #160827;
      border-radius: 14px;
      text-align: left;
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<main>

  <h1>ONERYA DREAMS</h1>

  <p class="subtitle">
    Transforme ton rêve en expérience cinématographique.
  </p>

  <button id="createButton">
    Créer mon rêve
  </button>

  <section id="dreamBox">

    <textarea
      id="dreamInput"
      placeholder="Décris ton rêve ici..."
    ></textarea>

    <br>

    <button id="generateButton">
      Générer mon histoire
    </button>

    <div id="story"></div>

  </section>

</main>

<script>

  const createButton = document.getElementById("createButton");
  const dreamBox = document.getElementById("dreamBox");
  const generateButton = document.getElementById("generateButton");
  const dreamInput = document.getElementById("dreamInput");
  const story = document.getElementById("story");

  createButton.onclick = function() {

    dreamBox.style.display = "block";
    createButton.style.display = "none";

    dreamInput.focus();

  };

  generateButton.onclick = async function() {

    const dream = dreamInput.value.trim();

    if (!dream) {
      alert("Décris ton rêve avant de continuer.");
      return;
    }

    story.style.display = "block";
    story.textContent = "✨ ONERYA DREAMS crée ton histoire...";

    try {

      const response = await fetch("/api/generate-story", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          dream: dream
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Erreur");
      }

      story.textContent = data.story;

    } catch (error) {

      story.textContent =
        "Le générateur est momentanément indisponible.";

      console.error(error);

    }

  };

</script>

</body>
</html>
